services:
  fedmed-server:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./api:/app/api
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn pydantic &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    networks:
      - fedmed-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  hospital-a:
    image: fedmed_dsml_intern_grp20-hospital-a:latest
    environment:
      HOSPITAL_ID: hospital_a
    ports:
      - "8081:8080"
    networks:
      - fedmed-network
    depends_on:
      fedmed-server:
        condition: service_healthy

  hospital-b:
    image: fedmed_dsml_intern_grp20-hospital-a:latest
    environment:
      HOSPITAL_ID: hospital_b
    ports:
      - "8082:8080"
    networks:
      - fedmed-network
    depends_on:
      fedmed-server:
        condition: service_healthy

  hospital-c:
    image: fedmed_dsml_intern_grp20-hospital-a:latest
    environment:
      HOSPITAL_ID: hospital_c
    ports:
      - "8083:8080"
    networks:
      - fedmed-network
    depends_on:
      fedmed-server:
        condition: service_healthy

networks:
  fedmed-network:
    driver: bridge
