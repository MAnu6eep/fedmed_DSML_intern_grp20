services:

  # ---------------------------------------------------------------------------
  # Central Flower Federation Superlink Server
  # ---------------------------------------------------------------------------
  federation-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    working_dir: /app
    command: >
      flower-superlink
      --insecure
      --fleet-api-address 0.0.0.0:9092
      --control-api-address 0.0.0.0:9093
      --serverappio-api-address 0.0.0.0:9091
    volumes:
      - ./fedmed:/app/fedmed:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    ports:
      - "9201:9091"
      - "9202:9092"
      - "9203:9093"
    networks:
      - fedmed-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 9092), 2).close()"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Hospital A (Isolated Node & Storage)
  # ---------------------------------------------------------------------------
  hospital-a:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    environment:
      HOSPITAL_ID: hospital_a
      SUPERLINK_HOST: federation-server
      SUPERLINK_PORT: "9092"
    command: >
      sh -c "
      python -m fedmed.nodes.node_manager &
      exec flower-supernode
      --insecure
      --superlink $${SUPERLINK_HOST}:$${SUPERLINK_PORT}
      "
    ports:
      - "8081:8080"
    volumes:
      - ./hospitals/hospital_a/data:/app/hospitals/hospital_a/data:ro
      - ./hospitals/hospital_a/config.yaml:/app/hospitals/hospital_a/config.yaml:ro
    networks:
      - fedmed-network
    depends_on:
      federation-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Hospital B (Isolated Node & Storage)
  # ---------------------------------------------------------------------------
  hospital-b:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    environment:
      HOSPITAL_ID: hospital_b
      SUPERLINK_HOST: federation-server
      SUPERLINK_PORT: "9092"
    command: >
      sh -c "
      python -m fedmed.nodes.node_manager &
      exec flower-supernode
      --insecure
      --superlink $${SUPERLINK_HOST}:$${SUPERLINK_PORT}
      "
    ports:
      - "8082:8080"
    volumes:
      - ./hospitals/hospital_b/data:/app/hospitals/hospital_b/data:ro
      - ./hospitals/hospital_b/config.yaml:/app/hospitals/hospital_b/config.yaml:ro
    networks:
      - fedmed-network
    depends_on:
      federation-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Hospital C (Isolated Node & Storage)
  # ---------------------------------------------------------------------------
  hospital-c:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    environment:
      HOSPITAL_ID: hospital_c
      SUPERLINK_HOST: federation-server
      SUPERLINK_PORT: "9092"
    command: >
      sh -c "
      python -m fedmed.nodes.node_manager &
      exec flower-supernode
      --insecure
      --superlink $${SUPERLINK_HOST}:$${SUPERLINK_PORT}
      "
    ports:
      - "8083:8080"
    volumes:
      - ./hospitals/hospital_c/data:/app/hospitals/hospital_c/data:ro
      - ./hospitals/hospital_c/config.yaml:/app/hospitals/hospital_c/config.yaml:ro
    networks:
      - fedmed-network
    depends_on:
      federation-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Hospital D (Optional Scalable Node & Storage)
  # ---------------------------------------------------------------------------
  hospital-d:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    profiles: ["5-nodes"]
    environment:
      HOSPITAL_ID: hospital_d
      SUPERLINK_HOST: federation-server
      SUPERLINK_PORT: "9092"
    command: >
      sh -c "
      python -m fedmed.nodes.node_manager &
      exec flower-supernode
      --insecure
      --superlink $${SUPERLINK_HOST}:$${SUPERLINK_PORT}
      "
    ports:
      - "8084:8080"
    volumes:
      - ./hospitals/hospital_d/data:/app/hospitals/hospital_d/data:ro
      - ./hospitals/hospital_d/config.yaml:/app/hospitals/hospital_d/config.yaml:ro
    networks:
      - fedmed-network
    depends_on:
      federation-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Hospital E (Optional Scalable Node & Storage)
  # ---------------------------------------------------------------------------
  hospital-e:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    profiles: ["5-nodes"]
    environment:
      HOSPITAL_ID: hospital_e
      SUPERLINK_HOST: federation-server
      SUPERLINK_PORT: "9092"
    command: >
      sh -c "
      python -m fedmed.nodes.node_manager &
      exec flower-supernode
      --insecure
      --superlink $${SUPERLINK_HOST}:$${SUPERLINK_PORT}
      "
    ports:
      - "8085:8080"
    volumes:
      - ./hospitals/hospital_e/data:/app/hospitals/hospital_e/data:ro
      - ./hospitals/hospital_e/config.yaml:/app/hospitals/hospital_e/config.yaml:ro
    networks:
      - fedmed-network
    depends_on:
      federation-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # FastAPI Telemetry Backend
  # ---------------------------------------------------------------------------
  fedmed-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    working_dir: /app
    environment:
      HOSPITAL_A_HOST: hospital-a
      HOSPITAL_A_PORT: 8080
      HOSPITAL_B_HOST: hospital-b
      HOSPITAL_B_PORT: 8080
      HOSPITAL_C_HOST: hospital-c
      HOSPITAL_C_PORT: 8080
      HOSPITAL_D_HOST: hospital-d
      HOSPITAL_D_PORT: 8080
      HOSPITAL_E_HOST: hospital-e
      HOSPITAL_E_PORT: 8080
    command: >
      uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    networks:
      - fedmed-network
    depends_on:
      hospital-a:
        condition: service_healthy
      hospital-b:
        condition: service_healthy
      hospital-c:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # React / Vite Dashboard
  # ---------------------------------------------------------------------------
  dashboard:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./dashboard:/app
      - dashboard_node_modules:/app/node_modules
    command: >
      sh -c "npm ci &&
             npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    networks:
      - fedmed-network
    depends_on:
      fedmed-api:
        condition: service_healthy

# ---------------------------------------------------------------------------
# Shared network
# ---------------------------------------------------------------------------
networks:
  fedmed-network:
    driver: bridge

# ---------------------------------------------------------------------------
# Frontend dependency volume
# ---------------------------------------------------------------------------
volumes:
  dashboard_node_modules:
