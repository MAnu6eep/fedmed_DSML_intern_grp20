[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fedmed"
version = "0.1.0"
description = "Hybrid Privacy-Preserving Federated Learning for Medical Image Segmentation"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    # ML & Medical Imaging (Anudeep)
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "monai[all]>=1.3.0",
    "nibabel>=5.2.0",
    "scipy>=1.12.0",
    "numpy>=1.26.0,<2.0.0",
    
    # Federated Learning (Charan)
    "flwr[simulation]>=1.8.0",
    "protobuf>=4.25.0",
    "grpcio>=1.62.0",
    
    # Systems & API (Om / Manav)
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    
    # Privacy & Cryptography (Meerja)
    "tenseal>=0.3.14",
    "opacus>=1.4.0",
    "cryptography>=42.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.2.0",
    "flake8>=7.0.0"
]
